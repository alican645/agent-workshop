<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#2a2622;color:#efe6d8;font:14px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
  main{max-width:820px;margin:0 auto;padding:28px 32px 60px}
  .path{font-size:11px;color:#9e9485;margin-bottom:18px;font-family:ui-monospace,monospace}
  h1,h2,h3,h4{color:#fff3e2;line-height:1.3;margin:1.6em 0 .5em}
  h1{font-size:24px} h2{font-size:19px;border-bottom:1px solid #4a433b;padding-bottom:4px} h3{font-size:16px}
  a{color:#ffb070}
  code{font-family:ui-monospace,"SF Mono",monospace;font-size:12.5px;background:#3a342e;padding:1px 5px;border-radius:4px}
  pre{background:#1f1c19;padding:12px 14px;border-radius:8px;overflow:auto}
  pre code{background:none;padding:0}
  blockquote{margin:0;padding:2px 14px;border-left:3px solid #ffb070;color:#cfc4b3}
  table{border-collapse:collapse;margin:1em 0} th,td{border:1px solid #4a433b;padding:5px 10px} th{background:#353029}
  hr{border:0;border-top:1px solid #4a433b}
  li input{margin-right:6px}
</style>
<script src="vendor/marked.min.js"></script>
</head>
<body><main><div class="path" id="path"></div><div id="doc"></div></main>
<script>
  function render(text, path) {
    const y = scrollY;
    document.getElementById('path').textContent = path;
    document.getElementById('doc').innerHTML = marked.parse(text, { gfm: true });
    scrollTo(0, y);
  }
</script>
</body>
</html>
