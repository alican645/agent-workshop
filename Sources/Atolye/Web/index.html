<style>

<div id="panel" class="hud"></div>
<button id="home">← atölyeye dön</button>

<script>
  window.addEventListener('error', (e) => { const l = document.getElementById('loading'); if (l) l.textContent = 'Hata: ' + e.message; });
  // Sahne yüklenmeden gelen çağrıları sakla.
  window.atolye = { _q: null, _active: true, update(s) { this._q = s; }, setActive(v) { this._active = v; } };
  window.post = (m) => { try { webkit.messageHandlers.atolye.postMessage(m); } catch (e) { console.log('post', m); } };

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { BUILTINS, DEFAULTS, pick } from './robots.mjs';
import { builtinKind, customKind, instantiate, fallbackPose } from './robotkit.mjs';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const V = THREE.Vector3;
const ST = { busy: { c: '#2fa7d6', t: 'çalışıyor' }, waiting: { c: '#ff8c2e', t: 'seni bekliyor' }, done: { c: '#3aa57a', t: 'bitti' }, idle: { c: '#b3a998', t: 'boşta' } };
const SLOTS = { 1: [0], 2: [-2.4, 2.4], 3: [-3, 0, 3], 4: [-3.6, -1.2, 1.2, 3.6] };
const MAX_SLOTS = 4, GAP_X = 16, GAP_Z = 14, LABEL_FAR = 34;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function clockText() {
  const n = new Date(), h = n.getHours();
  document.getElementById('hello').textContent = (h < 12 ? 'Günaydın' : h < 18 ? 'İyi günler' : 'İyi akşamlar') + ' 👋';
  document.getElementById('clock').textContent = n.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' }) + ' · ' + n.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
}
clockText(); setInterval(clockText, 30000);

// ---------- renderer & scene ----------
const W = () => innerWidth, H = () => innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('stage').appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.setSize(W(), H());
Object.assign(labels.domElement.style, { position: 'fixed', top: '0', left: '0', pointerEvents: 'none' });
document.body.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3e9da);
scene.fog = new THREE.Fog(0xf3e9da, 70, 160);
const camera = new THREE.PerspectiveCamera(45, W() / H(), 0.1, 500);
let homeCam = new V(0, 19, 27), homeTgt = new V(0, 0, 0);
camera.position.copy(homeCam);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(homeTgt);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.44;
controls.minDistance = 6; controls.maxDistance = 120;
// Yakınlaştırmayı kendimiz yapıyoruz: OrbitControls her tekerlek olayında sabit adım atar; trackpad bir
// harekette onlarca küçük olay gönderdiği için sıçrar. Burada adım, hareketin büyüklüğüyle orantılı.
controls.enableZoom = false;
function zoomBy(f) {
  if (!isFinite(f) || f <= 0) return;
  fly = null;
  const off = camera.position.clone().sub(controls.target);
  off.setLength(THREE.MathUtils.clamp(off.length() * f, controls.minDistance, controls.maxDistance));
  camera.position.copy(controls.target).add(off);
}
let pinching = false, pinchScale = 1;
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (pinching) return; // WebKit pinch'i gesture olaylarıyla da bildirir; iki kez sayma
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;
  // ctrl+tekerlek: başka tarayıcılarda pinch böyle gelir; daha hassas.
  zoomBy(Math.exp(THREE.MathUtils.clamp(dy, -200, 200) * (e.ctrlKey ? 0.01 : 0.0025)));
}, { passive: false });
// Safari/WebKit trackpad pinch'i: scale hareket başından beri toplam oran.
renderer.domElement.addEventListener('gesturestart', (e) => { e.preventDefault(); pinching = true; pinchScale = e.scale || 1; });
renderer.domElement.addEventListener('gesturechange', (e) => {
  e.preventDefault();
  const sc = e.scale || 1;
  zoomBy(pinchScale / sc);
  pinchScale = sc;
});
renderer.domElement.addEventListener('gestureend', (e) => { e.preventDefault(); pinching = false; });

scene.add(new THREE.HemisphereLight(0xfff6e8, 0xc9b79a, 1.5));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(-18, 34, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 40, bottom: -40, near: 1, far: 120 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0xeadcc6, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(400, 200, 0xd8c7aa, 0xe0d1b8); grid.position.y = 0.01; scene.add(grid);

// ---------- helpers ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function box(w, h, d, color, opts = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.7, ...opts }));
  m.castShadow = true; m.receiveShadow = true; return m;
}
function css(cls, html) { const el = document.createElement('div'); el.className = cls; el.innerHTML = html; return el; }
const ang = (a) => Math.atan2(Math.sin(a), Math.cos(a));
function dispose(obj) {
  obj.traverse((o) => {
    if (o.isCSS2DObject) o.element.remove();
    if (o.geometry && !o.userData.sharedGeo) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.map?.dispose(); m.dispose(); });
  });
  obj.parent?.remove(obj);
}

// ---------- zones ----------
const wood = 0xb98a5c, metal = 0x8d8a86;
const zones = new Map();
function buildZone(info) {
  const g = new THREE.Group(); scene.add(g);
  const pad = box(12, 0.16, 9, info.color, { roughness: 0.95 }); pad.position.y = 0.08; pad.castShadow = false; g.add(pad);
  const bench = new THREE.Group(); bench.position.set(0, 0, -2.7); g.add(bench);
  const top = box(9.4, 0.16, 1.5, wood); top.position.y = 1.05; bench.add(top);
  for (const x of [-4.5, 4.5]) for (const zz of [-0.6, 0.6]) { const leg = box(0.14, 1.0, 0.14, metal); leg.position.set(x, 0.5, zz); bench.add(leg); }
  const signTex = canvasTex(512, 128, (c, w, h) => {
    c.fillStyle = '#fffaf1'; c.beginPath(); c.roundRect(0, 0, w, h, 24); c.fill();
    c.fillStyle = info.color; c.fillRect(0, h - 18, w, 18);
    c.fillStyle = '#2c2a26'; c.textAlign = 'center'; c.textBaseline = 'middle';
    let size = 56; c.font = `700 ${size}px -apple-system, system-ui, sans-serif`;
    while (c.measureText(info.name).width > w - 40 && size > 24) { size -= 4; c.font = `700 ${size}px -apple-system, system-ui, sans-serif`; }
    c.fillText(info.name, w / 2, h / 2 - 6);
  });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 1.3), new THREE.MeshStandardMaterial({ map: signTex, roughness: 0.8, transparent: true }));
  sign.position.set(0, 3.6, -3.75); g.add(sign);
  for (const x of [-2.3, 2.3]) { const p = box(0.12, 3.0, 0.12, metal); p.position.set(x, 1.5, -3.8); g.add(p); }
  const gitEl = css('gittag', ''); const gitTag = new CSS2DObject(gitEl); gitTag.position.set(0, 2.72, -3.75); gitTag.visible = false; g.add(gitTag);
  const more = new CSS2DObject(css('more', '')); more.position.set(3.2, 4.4, -3.75); more.visible = false; g.add(more);
  const crates = [[-5, 3], [5, 3]].map(([x, zz]) => { const c = box(0.9, 0.9, 0.9, 0xc99a63); c.position.set(x, 0.53, zz); c.rotation.y = Math.random(); g.add(c); return new V(x, 0, zz - 0.9); });
  const frame = new THREE.Group(); g.add(frame);
  const fm = new THREE.MeshStandardMaterial({ color: 0xff8c2e, emissive: 0xff7a1a, emissiveIntensity: 1.2 });
  for (const [w, d, x, zz] of [[12.4, 0.2, 0, 4.6], [12.4, 0.2, 0, -4.6], [0.2, 9.4, 6.1, 0], [0.2, 9.4, -6.1, 0]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.22, d), fm); b.position.set(x, 0.12, zz); frame.add(b);
  }
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), fm); beacon.position.set(0, 4.5, -3.75); frame.add(beacon);
  const lamp = new THREE.PointLight(0xff8c2e, 0, 14, 1.5); lamp.position.set(0, 4, -2); frame.add(lamp);
  const hit = new THREE.Mesh(new THREE.BoxGeometry(12, 4, 9), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
  hit.position.y = 2; g.add(hit);
  const slots = new THREE.Group(); bench.add(slots);
  const machGroup = new THREE.Group(); g.add(machGroup);
  g.scale.setScalar(0.001);
  const Z = { id: info.id, info, g, bench, slots, slotCount: -1, xs: [], screens: [], crates, frame, fm, lamp, hit, more, target: new V(), leaving: false, robots: [], machGroup, machKey: '', machs: [], gitEl, gitTag };
  zones.set(info.id, Z);
  return Z;
}
function setSlots(Z, n) {
  n = Math.max(1, Math.min(MAX_SLOTS, n));
  if (Z.slotCount === n) return;
  Z.slotCount = n; Z.xs = SLOTS[n];
  while (Z.slots.children.length) dispose(Z.slots.children[0]);
  Z.screens = Z.xs.map((x) => {
    const mon = box(1.5, 1.0, 0.1, 0x2d2b29); mon.position.set(x, 1.75, -0.45); Z.slots.add(mon);
    const stand = box(0.12, 0.5, 0.12, 0x2d2b29); stand.position.set(x, 1.3, -0.45); Z.slots.add(stand);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 0.86), new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x2fa7d6, emissiveIntensity: 0.6 }));
    scr.position.set(x, 1.75, -0.39); Z.slots.add(scr);
    return scr;
  });
}

// ---------- machines (düz terminaller) ----------
const MAX_MACH = 4;
const machHits = [];
function setMachines(Z, list) {
  const shown = list.slice(0, MAX_MACH);
  const key = shown.map((m) => m.id + ':' + m.title).join('|');
  if (key !== Z.machKey) {
    Z.machKey = key;
    for (const m of Z.machs) { const i = machHits.indexOf(m.hit); if (i >= 0) machHits.splice(i, 1); }
    while (Z.machGroup.children.length) dispose(Z.machGroup.children[0]);
    Z.machs = shown.map((mi, i) => {
      const g = new THREE.Group(); g.position.set(5.25, 0.16, -1.6 + i * 1.1); g.rotation.y = -Math.PI / 2; Z.machGroup.add(g);
      const body = box(0.8, 0.95, 0.7, 0x8d8a86); body.position.y = 0.48; g.add(body);
      const top = box(0.86, 0.08, 0.76, 0x6f6b66); top.position.y = 0.99; g.add(top);
      const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.36), new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x3aa57a, emissiveIntensity: 0 }));
      scr.position.set(0, 0.62, 0.351); g.add(scr);
      const led = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0x3aa57a, emissiveIntensity: 0 }));
      led.position.set(0.28, 0.9, 0.36); g.add(led);
      const tagEl = css('tag m', '⚙ ' + esc(mi.title)); const tag = new CSS2DObject(tagEl); tag.position.y = 1.35; g.add(tag);
      const hit = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.8), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
      hit.position.y = 0.6; hit.userData.machine = mi.id; g.add(hit); machHits.push(hit);
      return { id: mi.id, scr, led, tagEl, hit, active: false };
    });
  }
  Z.machs.forEach((m, i) => { m.active = !!shown[i]?.active; });
}

// ---------- robots ----------
let base = null;                 // RobotExpressive: hazır robotların gövdesi
const kinds = new Map();         // kostüm id → { template, clips, H, ... } (hazır ve yüklenmiş kendi robotları)
const kindState = new Map();     // kendi robotu id → 'loading' | 'failed' | 'ok'
let pool = [];                   // açık robotlar (snapshot.robots)
const robots = new Map(); // id → robot (ana robotlar ve yardımcılar)
const hitBoxes = [];
const ROBOT_H = { main: 2.1, sub: 1.25 };

/** Yeni robot için kostüm: rolünün havuzundan, atölyede en az kullanılanı. */
function chooseKind(role, sessionId) {
  const inUse = new Map();
  for (const r of robots.values()) if (!r.leaving) inUse.set(r.kindId, (inUse.get(r.kindId) || 0) + 1);
  const avail = pool.map((p) => ({ ...p, failed: !kinds.has(p.id) }));
  return pick(avail, role, inUse, sessionId);
}

// Kendi robotlarını yükle; yüklenemeyeni bildir (havuzda atlanır).
const loader = new GLTFLoader();
function syncPool(list) {
  pool = list || BUILTINS.map((b) => ({ id: b.id, role: b.role, builtin: true }));
  for (const p of pool) {
    if (p.builtin || kindState.has(p.id)) {
      const k = kinds.get(p.id); if (k && !p.builtin) k.flipped = !!p.flipped;
      continue;
    }
    kindState.set(p.id, 'loading');
    const fail = (e) => { kindState.set(p.id, 'failed'); post({ type: 'robotFailed', id: p.id, error: String(e?.message || e) }); settle(); };
    loader.load(p.url, (g) => {
      try { kinds.set(p.id, customKind(p.id, g, !!p.flipped)); kindState.set(p.id, 'ok'); settle(); }
      catch (e) { fail(e); }
    }, undefined, fail);
  }
}
const loadingPool = () => pool.some((p) => !p.builtin && kindState.get(p.id) === 'loading');
// Kendi robotları yüklenirken oluşan robotlar geçicidir; yüklemeler bitince havuzdan yeniden seçilir.
function settle() {
  if (loadingPool()) return;
  for (const r of robots.values()) {
    if (!r.provisional || r.leaving) continue;
    r.provisional = false;
    const was = r.kindId; r.kindId = null;
    const k = chooseKind(r.agent ? 'sub' : 'main', r.id);
    if (k !== was) reskin(r, k); else r.kindId = was;
  }
}
/** Robotun kostümünü yerinde değiştir (konum, durum, etiket korunur). */
function reskin(r, kindId) {
  const kind = kinds.get(kindId); if (!kind) return;
  const h = ROBOT_H[r.agent ? 'sub' : 'main'] * (kind.def?.scale || 1);
  r.g.remove(r.root); r.mixer.stopAllAction();
  const inst = instantiate(kind, h);
  r.g.add(inst.root);

      for (const r of robots.values()) if (r.zone === Z) r.tagEl.style.opacity = far ? '0' : '1';
      for (const m of Z.machs) m.tagEl.style.opacity = far ? '0' : '1';
      Z.gitEl.style.opacity = far ? '0' : '1';
    }
    if (far) for (const r of robots.values()) if (r.zone === Z && !r.bubSticky && r.bubT > 0) r.bubEl.style.opacity = '0';
  }

  for (const s of [...sparkList]) {
    s.t -= dt; s.v.y -= 9 * dt; s.m.position.addScaledVector(s.v, dt);
    if (s.t <= 0) { scene.remove(s.m); sparkList.splice(sparkList.indexOf(s), 1); }
  }

  if (fly) {
    controls.target.lerp(fly.tgt, Math.min(1, dt * 2.5));
    camera.position.lerp(fly.cam, Math.min(1, dt * 2.5));
    if (camera.position.distanceTo(fly.cam) < 0.05) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
}

// Pencere görünmezken saniyede 4 kare.
let slowTimer = null;
function setActive(v) {
  window.atolye._active = v;
  if (v) { clearInterval(slowTimer); slowTimer = null; renderer.setAnimationLoop(tick); }
  else { renderer.setAnimationLoop(null); if (!slowTimer) slowTimer = setInterval(tick, 250); }
}
window.atolye.setActive = setActive;
document.addEventListener('visibilitychange', () => setActive(document.visibilityState === 'visible'));

addEventListener('resize', () => {
  camera.aspect = W() / H(); camera.updateProjectionMatrix();
  renderer.setSize(W(), H()); labels.setSize(W(), H());
});

loader.load('./models/RobotExpressive.glb', (gltf) => {
  base = { scene: gltf.scene, clips: gltf.animations };
  for (const def of BUILTINS) kinds.set(def.id, builtinKind(def, base));
  document.getElementById('loading').remove();
  const q = window.atolye._q; window.atolye._q = null;
  apply(q || { zones: [] });
  setActive(window.atolye._active);
}, undefined, (err) => { document.getElementById('loading').textContent = 'Robot modeli yüklenemedi: ' + (err?.message || err); });

post({ type: 'ready' });
</script>
