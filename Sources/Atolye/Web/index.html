  });
}
// 1–9 odaktaki balonun seçeneği, Enter çoklu seçimde gönderir, Esc odağı bırakır. ⌘'li kısayollara dokunulmaz.
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches?.('input, textarea')) return;
  const f = focusNow(); if (!f) return;
  const found = promptItem(f);
  if (!found) { hoverFocus = clickFocus = null; return; }
  const { Z, it } = found;
  if (e.key === 'Escape') { hoverFocus = clickFocus = null; markFocus(); }
  else if (/^[1-9]$/.test(e.key)) choose(Z, it, Number(e.key) - 1);
  else if (e.key === 'Enter' && it.prompt.multi) submit(Z, it);
  else return;
  e.preventDefault(); e.stopPropagation();
}, true);

// ---------- reconcile snapshot ----------
function layout() {
  const list = snapshot.zones;
  const n = list.length, cols = Math.max(1, Math.ceil(Math.sqrt(n))), rows = Math.max(1, Math.ceil(n / cols));
  list.forEach((info, i) => {
    const Z = zones.get(info.id);
    const row = Math.floor(i / cols), inRow = Math.min(cols, n - row * cols), col = i % cols;
    Z.target.set((col - (inRow - 1) / 2) * GAP_X, 0, (row - (rows - 1) / 2) * GAP_Z);
  });
  zoneGrid = { cols, rows };
  fitHome();
  if (!selected) fly = { tgt: homeTgt.clone(), cam: homeCam.clone() };
}
/** Genel görünüm: bütün platformlar ekrana sığacak kadar uzak (proje sayısına ve pencere oranına göre). */
let zoneGrid = { cols: 1, rows: 1 };
function fitHome() {
  const d = homeDistance({ ...zoneGrid, gapX: GAP_X, gapZ: GAP_Z, fov: camera.fov, aspect: camera.aspect });
  homeTgt = new V(0, 0, 0);
  homeCam = new V(...homePosition(d));
  controls.maxDistance = Math.max(120, d * 1.6);
  scene.fog.near = Math.max(70, d + 15); scene.fog.far = Math.max(160, d * 2.5);
}
function usd(v) { return v < 0.01 ? '<$0.01' : '$' + (v < 100 ? v.toFixed(2) : v.toFixed(0)); }
function tok(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(0) + 'K' : String(n); }
function gitText(g) {
  return `⎇ ${esc(g.branch)}` + (g.changed ? ` <span class="gc">● ${g.changed}</span>` : '')
    + (g.ahead ? ` <span class="ga">↑${g.ahead}</span>` : '') + (g.behind ? ` <span class="gb">↓${g.behind}</span>` : '');
}
// Git özeti: tabela altındaki etiket + akış olayları (commit, itme, çekme, dal değişimi).
function applyGit(Z, pg, ng) {
  Z.gitTag.visible = !!ng;
  Z.gitEl.innerHTML = ng ? gitText(ng) : '';
  if (!pg || !ng) return;
  const n = `<b>${esc(Z.info.name)}</b>`;
  if (pg.branch !== ng.branch) feed(`${n} · ${t('dal değişti: {0} → {1}', esc(pg.branch), `<b>${esc(ng.branch)}</b>`)}`);
  else if (ng.head && pg.head !== ng.head && ng.behind < pg.behind) feed(`${n} · <span style="color:#4a7fd0">⇣ ${t('{0} commit çekildi', pg.behind - ng.behind)}</span>`);
  else if (ng.head && pg.head !== ng.head) feed(`${n} · <span style="color:#3aa57a">✔ commit</span>: “${esc(ng.headSubject || '')}”`);
  else if (ng.ahead < pg.ahead && ng.behind === pg.behind) feed(`${n} · <span style="color:#3aa57a">⇡ ${t('{0} commit itildi', pg.ahead - ng.ahead)}</span>`);
}
function apply(s) {
  const prev = snapshot; snapshot = s;
  syncPool(s.robots);
  const prevRobots = new Map(prev.zones.flatMap((z) => z.robots.map((r) => [r.id, r])));
  const zonesChanged = prev.zones.map((z) => z.id).join('|') !== s.zones.map((z) => z.id).join('|');
  const seen = new Set();
  for (const info of s.zones) {
    const Z = zones.get(info.id) || buildZone(info);
    Z.info = info; Z.leaving = false;
    const shown = info.robots.slice(0, MAX_SLOTS);
    setSlots(Z, shown.length);
    setMachines(Z, info.machines || []);
    setBoard(Z, info.todos);
    setRack(Z, info.cards);
    applyGit(Z, (prev.zones.find((z) => z.id === info.id) || {}).git, info.git);
    Z.more.visible = info.robots.length > MAX_SLOTS;
    Z.more.element.textContent = `+${info.robots.length - MAX_SLOTS}`;
    shown.forEach((ri, i) => {
      seen.add(ri.id);
      const home = new V(Z.xs[i], 0.16, -1.55);
      let r = robots.get(ri.id);
      if (!r) {
        r = makeRobot(Z, { id: ri.id, kindId: chooseKind('main', ri.id), ring: info.color, home });
        r.g.rotation.y = Math.PI;
        if (ri.task) r.taskIntro = 'go';
        if (prev.zones.length || prevRobots.size) feed(`<b>${esc(info.name)}</b> · ${t('{0} atölyeye geldi', esc(ri.label))}`);
      }
      if (!r.home.equals(home)) { r.home.copy(home); r.want = null; }
      const old = prevRobots.get(ri.id);
      r.info = ri;
      r.tagEl.innerHTML = esc(ri.label) + (ri.profile ? ` <span class="p">· ${esc(ri.profile)}</span>` : '');
      if (old && old.state !== ri.state) {
        if (ri.state === 'waiting') feed(`<b>${esc(info.name)}</b> · ${esc(ri.label)} <span style="color:#ff8c2e">${t('seni çağırıyor')}</span>${ri.waitingFor ? ': ' + esc(ri.waitingFor) : ''}`);
        if (ri.state === 'done') feed(`<b>${esc(info.name)}</b> · ${esc(ri.label)} <span style="color:#3aa57a">${t('işini bitirdi')}</span> 👍`);
        if (ri.state === 'busy' && old.state !== 'waiting') feed(`<b>${esc(info.name)}</b> · ${t('{0} işe başladı', esc(ri.label))}`);
      }
      if (ri.tool && ri.tool !== r.lastTool && ri.state === 'busy') {
        if (!r.bubSticky) bubble(r, esc(ri.tool), 2.4);
        sparks(r);
        feed(`<b>${esc(info.name)}</b> · ${esc(ri.label)} → ${esc(ri.tool)}`);
      }
      r.lastTool = ri.tool;
      // yardımcılar
      ri.helpers.forEach((hi, k) => {
        seen.add(hi.id);
        let h = robots.get(hi.id);
        const hhome = new V(home.x + (k % 2 ? 1.5 : -1.5), 0.16, 0.9 + Math.floor(k / 2) * 1.4);
        if (!h) {
          h = makeRobot(Z, { id: hi.id, kindId: chooseKind('sub', hi.id), home: hhome, start: r.g.position, agent: true, parent: r });
          h.info = { state: 'busy' };
          goTo(h, hhome, 'work');
          feed(`<b>${esc(info.name)}</b> · ${t('{0} yardımcı gönderdi: {1}', esc(ri.label), `<span style="color:#6f5fb0">“${esc(hi.task)}”</span>`)}`);
        }
        if (!h.home.equals(hhome)) { h.home.copy(hhome); goTo(h, hhome, 'work'); }
        h.tagEl.textContent = `↳ ${hi.task}`;
        if (hi.tool && hi.tool !== h.lastTool) { bubble(h, esc(hi.tool), 2.2); sparks(h); }
        h.lastTool = hi.tool;
      });
    });
  }
  for (const r of robots.values()) if (!seen.has(r.id) && !r.leaving) {
    removeRobot(r);
    if (r.agent) feed(`<b>${esc(r.zone.info.name)}</b> · ${t('yardımcı “{0}” işini bitirip döndü', esc(r.tagEl.textContent.slice(2)))}`);
  }
  const live = new Set(s.zones.map((z) => z.id));
  for (const Z of zones.values()) if (!live.has(Z.id)) Z.leaving = true;
  if (zonesChanged) layout();
  counts(); renderPanel();
  // Bekleyenlerin balonları; artık beklemeyen robotların yerel balon durumu atılır.
  const asking = new Set(s.zones.flatMap((z) => z.robots.filter((r) => r.prompt).map((r) => r.id)));
  for (const m of [ui.pending, ui.checks, ui.edit, ui.menus]) for (const id of [...m.keys()]) if (!asking.has(id)) m.delete(id);
  if (hoverFocus && !asking.has(hoverFocus.robot)) hoverFocus = null;
  if (clickFocus && !asking.has(clickFocus.robot)) clickFocus = null;
  renderBalloons();
}
window.atolye.update = (s) => { if (started) apply(s); else window.atolye._q = s; };

// ---------- frame loop ----------
const clock = new THREE.Clock();
const camDist = new V();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  for (const r of [...robots.values()]) {
    if (!r.agent && !r.leaving && r.info) behave(r);
    const target = r.leaving ? 0.001 : r.scale;
    const s = THREE.MathUtils.damp(r.g.scale.x, target, 5, dt); r.g.scale.setScalar(s);
    if (r.leaving && s < 0.01) { robots.delete(r.id); dispose(r.g); continue; }
    if (r.mode === 'walk' && r.dest) {
      const p = r.g.position, d = r.dest.clone().sub(p); d.y = 0;
      const dist = d.length(), speed = r.agent ? 1.6 : 2.3;
      if (dist < 0.06) { p.copy(r.dest); r.dest = null; enter(r, r.after); }
      else { p.addScaledVector(d.normalize(), Math.min(dist, speed * dt)); r.face = Math.atan2(d.x, d.z); }
    } else {
      r.modeT = (r.modeT || 0) + dt;
      if (r.mode === 'work') {
        r.timer -= dt;
        if (r.timer <= 0) {
          r.timer = (r.agent ? 4 : 9) + Math.random() * 8;
          if (Math.random() < (r.agent ? 0.6 : 0.3)) goTo(r, r.zone.crates[r.g.position.x < 0 ? 0 : 1], 'pick');
        }
      }
      if (r.mode === 'pick' && r.modeT > 1.3) goTo(r, r.home, 'work');
      if (r.mode === 'thumbs' && r.modeT > 2.2) enter(r, 'idle');
      if (r.mode === 'board' && r.modeT > 1.8) { r.taskIntro = null; r.want = null; } // işi aldı: durumuna göre devam
    }
    r.g.rotation.y += ang(r.face - r.g.rotation.y) * Math.min(1, dt * 8);
    if (!r.bubSticky && r.bubT > 0) { r.bubT -= dt; if (r.bubT <= 0) r.bubEl.style.opacity = '0'; }
    r.mixer.update(dt);
    if (r.fb) { r.fbT += dt; fallbackPose(r.inner, r.fb, r.fbT, r.kindH); }
  }

  for (const Z of [...zones.values()]) {
    const target = Z.leaving ? 0.001 : 1;
    const s = THREE.MathUtils.damp(Z.g.scale.x, target, 4, dt); Z.g.scale.setScalar(s);
    if (Z.leaving && s < 0.01 && ![...robots.values()].some((r) => r.zone === Z)) { zones.delete(Z.id); for (const m of Z.machs) { const i = machHits.indexOf(m.hit); if (i >= 0) machHits.splice(i, 1); } { const i = boardHits.indexOf(Z.board.hit); if (i >= 0) boardHits.splice(i, 1); } { const i = rackHits.indexOf(Z.rack.hit); if (i >= 0) rackHits.splice(i, 1); } for (const it of Z.rack.items) { const i = gearHits.indexOf(it.hit); if (i >= 0) gearHits.splice(i, 1); } dispose(Z.g); if (selected === Z.id) goHome(); continue; }
    Z.g.position.lerp(Z.target, Math.min(1, dt * 3));
    animateRack(Z, dt);
    const waiting = Z.info.robots.some((r) => r.state === 'waiting');
    Z.frame.visible = waiting && !Z.leaving;
    if (waiting) { const p = 0.5 + 0.5 * Math.sin(t * 5); Z.fm.emissiveIntensity = 0.6 + 1.4 * p; Z.lamp.intensity = 6 + 18 * p; }
    Z.info.robots.slice(0, MAX_SLOTS).forEach((r, i) => {
      const m = Z.screens[i]?.material; if (!m) return;
      m.emissive.set(ST[r.state].c);
      m.emissiveIntensity = r.state === 'busy' ? 0.55 + 0.25 * Math.sin(t * 9 + i * 2) * Math.sin(t * 2.3) : r.state === 'idle' ? 0.08 : 0.6;
    });
    for (const m of Z.machs) {
      const k = m.active ? 0.7 + 0.3 * Math.sin(t * 8) : 0;
      m.scr.material.emissiveIntensity = m.active ? 0.5 + 0.2 * Math.sin(t * 6) : 0.04;
      m.led.material.emissiveIntensity = k * 2;
    }
    // Uzaktan yalnız tabela ve bekleme balonu görünsün.
    const far = camDist.copy(Z.g.position).distanceTo(camera.position) > LABEL_FAR;
    if (Z._far !== far) {
      Z._far = far;
      for (const r of robots.values()) if (r.zone === Z) r.tagEl.style.opacity = far ? '0' : '1';
      for (const m of Z.machs) m.tagEl.style.opacity = far ? '0' : '1';
      Z.gitEl.style.opacity = far ? '0' : '1';
    }
    if (far) for (const r of robots.values()) if (r.zone === Z && !r.bubSticky && r.bubT > 0) r.bubEl.style.opacity = '0';
  }

  for (const s of [...sparkList]) {
    s.t -= dt; s.v.y -= 9 * dt; s.m.position.addScaledVector(s.v, dt);
    if (s.t <= 0) { scene.remove(s.m); sparkList.splice(sparkList.indexOf(s), 1); }
  }

  if (fly) {
    controls.target.lerp(fly.tgt, Math.min(1, dt * 2.5));
    camera.position.lerp(fly.cam, Math.min(1, dt * 2.5));
    if (camera.position.distanceTo(fly.cam) < 0.05) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
}

// Pencere görünmezken saniyede 4 kare.
let slowTimer = null;
function setActive(v) {
  window.atolye._active = v;
  if (v) { clearInterval(slowTimer); slowTimer = null; renderer.setAnimationLoop(tick); }
  else { renderer.setAnimationLoop(null); if (!slowTimer) slowTimer = setInterval(tick, 250); }
}
window.atolye.setActive = setActive;
document.addEventListener('visibilitychange', () => setActive(document.visibilityState === 'visible'));

addEventListener('resize', () => {
  camera.aspect = W() / H(); camera.updateProjectionMatrix();
  renderer.setSize(W(), H()); labels.setSize(W(), H());
  fitHome(); // odakta değilken bir sonraki "atölyeye dön" yeni orana göre
});

// Hazır robotların hepsi yüklenince sahne başlar; yüklenemeyen hazır robot havuzda atlanır.
Promise.allSettled(BUILTINS.map((def) => loader.loadAsync(def.url).then((g) => {
  kinds.set(def.id, modelKind(def.id, g, { hide: def.hide, clips: def.clips, builtin: true }));
}).catch((e) => post({ type: 'robotFailed', id: def.id, error: String(e?.message || e) })))).then(() => {
  if (!kinds.size) { document.getElementById('loading').textContent = t('Robot modelleri yüklenemedi.'); return; }
  for (const role of ['main', 'sub']) if (!kinds.has(DEFAULTS[role])) { // varsayılan yoksa rolün yüklenen ilk robotu
    const alt = BUILTINS.find((b) => b.role === role && kinds.has(b.id)) || BUILTINS.find((b) => kinds.has(b.id));
    DEFAULTS[role] = alt.id;
  }
  document.getElementById('loading').remove();
  started = true;
  const q = window.atolye._q; window.atolye._q = null;
  apply(q || { zones: [] });
  setActive(window.atolye._active);
});

post({ type: 'ready' });
</script>
</body>
</html>
